name: pisco

services:
  db:
    image: postgres:16-alpine
    container_name: pisco-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pisco}
      POSTGRES_USER: ${POSTGRES_USER:-pisco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pisco}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pisco-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  pisco:
    build:
      context: .
      target: final
    image: pisco:latest
    container_name: pisco
    ports:
      - "${PISCO_PORT:-5080}:8080"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-pisco}
      POSTGRES_USER: ${POSTGRES_USER:-pisco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pisco}
    volumes:
      - pisco-keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pisco-pgdata:
  pisco-keys:
